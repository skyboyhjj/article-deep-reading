<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>读解 · 把文章拆开核验</title>
<style>
  :root{
    --bg:#fbfaf8; --fg:#1f2328; --muted:#6b7280; --line:#e3e0da;
    --ok:#2f7d5d; --warn:#a86a12; --fail:#b23b3b; --card:#fff; --accent:#2f4a3d;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font:16px/1.7 "Noto Serif CJK SC","Songti SC",Georgia,serif;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:820px;margin:0 auto;padding:56px 22px 80px}
  h1{font-size:26px;margin:0 0 6px;letter-spacing:.02em}
  .sub{color:var(--muted);font-size:14px;margin-bottom:26px}
  .box{display:flex;gap:10px;flex-wrap:wrap}
  input[type=url]{
    flex:1 1 420px;min-width:0;padding:13px 15px;font-size:16px;
    border:1px solid var(--line);border-radius:9px;background:var(--card);
    font-family:inherit;color:var(--fg);
  }
  input[type=url]:focus{outline:2px solid #c9d8cf;outline-offset:1px}
  button{
    padding:13px 22px;font-size:15px;border:0;border-radius:9px;
    background:var(--accent);color:#fff;cursor:pointer;font-family:inherit;
  }
  button:disabled{background:#9aa8a1;cursor:not-allowed}
  .note{color:var(--muted);font-size:13px;margin-top:12px;line-height:1.75}
  .note code{background:#f1efe9;padding:1px 5px;border-radius:4px;font-size:.92em}

  .paste{margin-top:16px;font-size:14px}
  .paste summary{cursor:pointer;color:var(--accent);font-size:14px}
  .paste input[type=text],.paste textarea{
    width:100%;margin-top:10px;padding:11px 13px;font-size:15px;
    border:1px solid var(--line);border-radius:9px;background:var(--card);
    font-family:inherit;color:var(--fg);resize:vertical;
  }
  .paste textarea{line-height:1.8}

  .upload{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .filebtn{
    display:inline-block;padding:9px 15px;font-size:13.5px;border-radius:8px;
    border:1px dashed #bcc9c1;color:var(--accent);background:#f7faf8;cursor:pointer;
  }
  .filebtn.busy{opacity:.6;cursor:wait}
  .filebtn.done{border-style:solid;border-color:#b7d3c4;background:#eef7f2;color:var(--ok)}
  #fname{flex:1 1 260px;font-size:12.5px;line-height:1.6}

  .stages{display:flex;gap:6px;margin:28px 0 6px;flex-wrap:wrap}
  .st{font-size:12.5px;padding:4px 10px;border-radius:20px;border:1px solid var(--line);
      color:var(--muted);background:var(--card);white-space:nowrap}
  .st.run{border-color:#b9c9c0;color:var(--accent);background:#eef4f0}
  .st.ok{border-color:#b7d3c4;color:var(--ok);background:#eef7f2}
  .st.warn{border-color:#e2cfa6;color:var(--warn);background:#fdf6e9}
  .st.fail{border-color:#e0b6b6;color:var(--fail);background:#fbeeee}
  .log{font-size:13px;color:var(--muted);margin:10px 0 0;min-height:20px}

  .card{margin-top:22px;background:var(--card);border:1px solid var(--line);
        border-radius:11px;padding:20px 22px}
  .card h2{font-size:15px;margin:0 0 12px;font-weight:600;letter-spacing:.02em;
           display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .kv{font-size:14px;color:var(--muted);margin:4px 0;word-break:break-word}
  .kv b{color:var(--fg);font-weight:600}

  .tabs{margin-left:auto;display:flex;gap:2px;background:#f3f1ec;border-radius:7px;padding:2px}
  .tab{background:transparent;color:var(--muted);border:0;border-radius:5px;
       padding:4px 11px;font-size:12.5px;cursor:pointer;font-family:inherit}
  .tab.on{background:var(--card);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.06)}

  /* 渲染视图 */
  .md{font-size:15.5px;line-height:1.85;word-break:break-word}
  .md>h2{font-size:19px;margin:20px 0 10px;letter-spacing:.01em}
  .md>h3{font-size:16.5px;margin:20px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--line)}
  .md>h4{font-size:15px;margin:16px 0 6px}
  .md p{margin:9px 0}
  .md ul{margin:8px 0 8px 20px;padding:0}
  .md li{margin:4px 0}
  .md hr{border:0;border-top:1px solid var(--line);margin:22px 0}
  .md blockquote{
    margin:12px 0;padding:9px 14px;border-left:3px solid #d8d3c8;
    color:#4a5158;background:#fbf9f5;border-radius:0 6px 6px 0;font-size:14.5px;
  }
  .md blockquote p{margin:3px 0}
  .md code{background:#f1efe9;padding:1px 5px;border-radius:4px;
           font-size:.9em;font-family:"SFMono-Regular",Consolas,monospace}
  .tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:12px 0;
           border:1px solid var(--line);border-radius:8px}
  .md table{border-collapse:collapse;width:100%;min-width:560px}
  .md th,.md td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);
                padding:8px 10px;text-align:left;vertical-align:top}
  .md tr:last-child td{border-bottom:0}
  .md th:last-child,.md td:last-child{border-right:0}
  .md th{background:#f6f4ef;font-weight:600;white-space:nowrap;font-size:13.5px}

  pre{
    white-space:pre-wrap;word-break:break-word;font-size:13.5px;line-height:1.85;
    background:#fcfbf9;border:1px solid var(--line);border-radius:9px;
    padding:18px;max-height:60vh;overflow:auto;margin:0;
    font-family:"SFMono-Regular",Consolas,"Noto Sans Mono CJK SC",monospace;
  }
  .err{color:var(--fail);font-size:14px;margin-top:16px}
  .actions{margin-top:14px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  .actions a{font-size:13.5px;color:var(--accent)}
  .hint{color:var(--muted);font-size:12.5px}

  /* 手机 */
  @media (max-width:640px){
    .wrap{padding:30px 14px calc(56px + env(safe-area-inset-bottom))}
    h1{font-size:22px}
    .sub{font-size:13.5px;margin-bottom:20px}
    .box{flex-direction:column}
    input[type=url]{flex:1 1 auto;width:100%}
    #go{width:100%;padding:14px}
    .stages{gap:4px;margin-top:22px}
    .st{font-size:11.5px;padding:3px 9px}
    .card{padding:16px 14px;border-radius:9px;margin-top:16px}
    .md{font-size:15px;line-height:1.8}
    .md>h2{font-size:17.5px}
    .md>h3{font-size:15.5px}
    .md table{min-width:440px;font-size:13px}
    .md th,.md td{padding:7px 8px}
    .md th{font-size:12.5px}
    pre{font-size:12.5px;padding:12px;max-height:56vh}

    /* 窄屏把表格变卡片：一行一张卡，字段名做前缀，避免横向滑动读长句 */
    .tblwrap{overflow:visible;border:0;margin:10px 0}
    .md table{display:block;width:100%;min-width:0;font-size:14px}
    .md thead{display:none}
    .md tbody{display:block}
    .md tr{
      display:block;border:1px solid var(--line);border-radius:8px;
      margin:9px 0;padding:7px 0;background:#fdfdfb;
    }
    .md td{
      display:block;border:0;padding:4px 13px;font-size:14px;line-height:1.7;
    }
    .md td[data-label]::before{
      content:attr(data-label) "　";
      color:var(--muted);font-size:12.5px;
    }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>读解</h1>
  <div class="sub">把文章拆开核验：定体裁、数作者序、逐条对依据、能算的地方真算一遍。</div>

  <div class="box">
    <input id="url" type="url" inputmode="url" autocapitalize="off" autocorrect="off"
           spellcheck="false" placeholder="粘贴文章链接（微信 / arXiv / 普通网页）" autocomplete="off">
    <button id="go">开始读解</button>
  </div>
  <div class="note">
    只做读解，不做摘要。标「未核」「未实算」之处请按未验证对待。<br>
    一次约 1–2 分钟。服务端需先配置 <code>LLM_API_KEY</code>。
  </div>

  <details class="paste">
    <summary>抓不到？直接粘贴正文（微信号反爬、付费墙、PDF 都走这里）</summary>
    <input id="ptitle" type="text" placeholder="标题（可留空，默认取正文首行）" autocomplete="off">
    <textarea id="ptext" rows="8" placeholder="把文章正文粘贴到这里（含数字的段落不要删，实算要用）"></textarea>
    <div class="note">粘贴模式下无法核对作者序与发布时间，报告里会如实标「未核」。</div>
  </details>

  <div class="upload">
    <label class="filebtn" id="fileLabel">
      上传视频/音频（可选，用于原声读解）
      <input id="file" type="file" accept="video/*,audio/*,.m4a,.mp3,.wav,.amr" hidden>
    </label>
    <span class="hint" id="fname">从微信「保存视频」导出后传上来，就能从「元宝总结」升到「原声转录」。</span>
    <span class="hint" id="fprog"></span>
  </div>

  <div class="stages" id="stages">
    <span class="st" data-s="extract">抓取</span>
    <span class="st" data-s="transcribe">转写</span>
    <span class="st" data-s="triage">定性</span>
    <span class="st" data-s="verify">核验</span>
    <span class="st" data-s="trace">溯源</span>
    <span class="st" data-s="compute">实算</span>
    <span class="st" data-s="render">成稿</span>
  </div>
  <div class="log" id="log"></div>
  <div class="err" id="err"></div>

  <div id="summary"></div>

  <div class="card" id="reportCard" style="display:none">
    <h2>报告
      <span class="tabs">
        <button class="tab on" data-v="brief">简约</button>
        <button class="tab" data-v="view">详细</button>
        <button class="tab" data-v="raw">原文</button>
      </span>
    </h2>
    <div id="bview" class="md"></div>
    <div id="rview" class="md" style="display:none"></div>
    <pre id="report" style="display:none"></pre>
    <div class="actions">
      <a id="dl" download="读解.md" href="#">下载 Markdown</a>
      <span class="hint">表格可左右滑动</span>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const LABEL = {extract:"抓取", transcribe:"转写", triage:"定性", verify:"核验", trace:"溯源", compute:"实算", render:"成稿"};
let busy = false;

function setStage(s, cls){
  const el = document.querySelector('.st[data-s="' + s + '"]');
  if(!el) return;
  el.className = "st " + cls;
  el.textContent = LABEL[s] + (cls === "run" ? "…" : "");
}

function resetStages(){
  document.querySelectorAll(".st").forEach(el => { el.className = "st"; });
  $("log").textContent = "";
  $("err").textContent = "";
  $("summary").innerHTML = "";
  $("reportCard").style.display = "none";
}

function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

/* 极简 markdown 渲染：只覆盖本报告用到的语法。
   先转义再替换行内标记，避免 XSS；表格单元格先保护转义竖线 \| 。 */
function inlineMd(s){
  const codes = [];
  let t = s.replace(/`([^`]+)`/g, (m, c) => {
    codes.push(c);
    return "\u0001" + (codes.length - 1) + "\u0001";
  });
  t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  t = t.replace(/\u0001(\d+)\u0001/g, (m, i) => "<code>" + codes[+i] + "</code>");
  return t;
}

function splitRow(line){
  const t = line.replace(/^\s*\|/, "").replace(/\|\s*$/, "");
  return t.replace(/\\\|/g, "\u0002").split("|")
          .map(c => c.replace(/\u0002/g, "|").trim());
}

function md2html(md){
  const lines = String(md).split("\n");
  const out = [];
  let i = 0;
  const isTableSep = (s) => /^\s*\|[\s:|-]+\|?\s*$/.test(s || "");

  while(i < lines.length){
    const raw = lines[i];
    const line = esc(raw);

    if(/^\s*$/.test(raw)){ i++; continue; }

    if(/^\s*\|/.test(raw) && isTableSep(lines[i+1])){
      const cells = splitRow(raw);
      const head = cells.map(c => inlineMd(esc(c)));
      const labels = cells.map(c => esc(c));   // 窄屏卡片模式下作为字段名
      i += 2;
      const rows = [];
      while(i < lines.length && /^\s*\|/.test(lines[i])){
        rows.push(splitRow(lines[i]).map(c => inlineMd(esc(c))));
        i++;
      }
      out.push(
        '<div class="tblwrap"><table><thead><tr>' +
        head.map(h => "<th>" + h + "</th>").join("") +
        "</tr></thead><tbody>" +
        rows.map(r => "<tr>" + r.map((c, ci) =>
          '<td data-label="' + (labels[ci] || "") + '">' + c + "</td>"
        ).join("") + "</tr>").join("") +
        "</tbody></table></div>"
      );
      continue;
    }

    if(/^###\s+/.test(raw)){ out.push("<h4>" + inlineMd(line.replace(/^###\s+/, "")) + "</h4>"); i++; continue; }
    if(/^##\s+/.test(raw)){ out.push("<h3>" + inlineMd(line.replace(/^##\s+/, "")) + "</h3>"); i++; continue; }
    if(/^#\s+/.test(raw)){ out.push("<h2>" + inlineMd(line.replace(/^#\s+/, "")) + "</h2>"); i++; continue; }
    if(/^\s*---+\s*$/.test(raw)){ out.push("<hr>"); i++; continue; }

    if(/^\s*>\s?/.test(raw)){
      const buf = [];
      while(i < lines.length && /^\s*>\s?/.test(lines[i])){
        buf.push(inlineMd(esc(lines[i].replace(/^\s*>\s?/, ""))));
        i++;
      }
      out.push("<blockquote><p>" + buf.join("<br>") + "</p></blockquote>");
      continue;
    }

    if(/^\s*[-*]\s+/.test(raw)){
      const buf = [];
      while(i < lines.length && /^\s*[-*]\s+/.test(lines[i])){
        buf.push("<li>" + inlineMd(esc(lines[i].replace(/^\s*[-*]\s+/, ""))) + "</li>");
        i++;
      }
      out.push("<ul>" + buf.join("") + "</ul>");
      continue;
    }

    const buf = [];
    while(i < lines.length && !/^\s*$/.test(lines[i]) && !/^\s*([#>|]|[-*]\s|---)/.test(lines[i])){
      buf.push(inlineMd(esc(lines[i])));
      i++;
    }
    if(!buf.length){ buf.push(inlineMd(line)); i++; }
    out.push("<p>" + buf.join("<br>") + "</p>");
  }
  return out.join("\n");
}

let uploadId = "";

function fmtDur(sec){
  const t = Math.round(sec || 0);
  return Math.floor(t / 60) + "分" + String(t % 60).padStart(2, "0") + "秒";
}

function uploadFile(f){
  const xhr = new XMLHttpRequest();
  xhr.open("POST", "/api/upload");
  xhr.setRequestHeader("Content-Type", "application/octet-stream");
  xhr.setRequestHeader("X-Filename", encodeURIComponent(f.name));
  $("fileLabel").classList.add("busy");
  $("fileLabel").classList.remove("done");
  $("fprog").textContent = "上传中 0%";
  xhr.upload.onprogress = (ev) => {
    if(ev.lengthComputable){
      $("fprog").textContent = "上传中 " + Math.round(ev.loaded / ev.total * 100) + "%";
    }
  };
  xhr.onload = () => {
    $("fileLabel").classList.remove("busy");
    let r = {};
    try{ r = JSON.parse(xhr.responseText); }catch(e){}
    if(xhr.status === 200 && r.id){
      uploadId = r.id;
      $("fileLabel").classList.add("done");
      $("fprog").textContent = "";
      const mb = (r.bytes / 1024 / 1024).toFixed(1);
      const dur = r.duration ? "，时长 " + fmtDur(r.duration) : "";
      $("fname").textContent = "已上传：" + r.name + "（" + mb + " MB" + dur + "）— 将走原声转录";
    }else{
      $("fprog").textContent = "";
      $("err").textContent = "上传失败：" + (r.error || ("HTTP " + xhr.status));
    }
  };
  xhr.onerror = () => {
    $("fileLabel").classList.remove("busy");
    $("fprog").textContent = "";
    $("err").textContent = "上传失败：网络错误";
  };
  xhr.send(f);
}

$("file").addEventListener("change", (e) => {
  const f = e.target.files && e.target.files[0];
  if(f) uploadFile(f);
});

function showExtract(d){
  const authors = (d.authors || []).join("、") || "未取到";
  const notes = (d.notes || []).map(n => '<div class="kv">· ' + esc(n) + "</div>").join("");
  $("summary").innerHTML =
    '<div class="card"><h2>抓取结果</h2>' +
    '<div class="kv">标题：<b>' + esc(d.title || "未取到") + "</b></div>" +
    '<div class="kv">作者（按页面顺序）：<b>' + esc(authors) + "</b></div>" +
    '<div class="kv">发布：' + esc(d.published || "未取到") + "　正文：" + (d.n_chars || 0) + " 字</div>" +
    notes + "</div>";
}

async function run(){
  if(busy) return;
  const url = $("url").value.trim();
  const text = $("ptext").value.trim();
  const title = $("ptitle").value.trim();
  const hasText = text.length >= 200;
  if(!hasText && !uploadId && !/^https?:\/\//i.test(url)){
    $("err").textContent = "请给链接、粘贴正文，或上传音视频";
    return;
  }

  busy = true; $("go").disabled = true; resetStages();

  try{
    const resp = await fetch("/api/analyze", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({url: url, text: text, title: title, upload_id: uploadId})
    });
    if(!resp.ok || !resp.body){
      const t = await resp.text();
      let msg = t;
      try{ msg = JSON.parse(t).error || t; }catch(e){}
      $("err").textContent = "请求失败：" + msg;
      return;
    }

    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = "";

    while(true){
      const {value, done} = await reader.read();
      if(done) break;
      buf += dec.decode(value, {stream: true});
      let idx;
      while((idx = buf.indexOf("\n\n")) >= 0){
        const chunk = buf.slice(0, idx);
        buf = buf.slice(idx + 2);
        handleEvent(chunk);
      }
    }
  }catch(e){
    $("err").textContent = "网络错误：" + e.message;
  }finally{
    busy = false; $("go").disabled = false;
  }
}

function handleEvent(chunk){
  const lines = chunk.split("\n").filter(l => l.indexOf("data:") === 0);
  if(!lines.length) return;
  let ev;
  try{ ev = JSON.parse(lines.map(l => l.slice(5).trim()).join("")); }catch(e){ return; }

  const stage = ev.stage, status = ev.status, text = ev.text, data = ev.data;
  if(text) $("log").textContent = text;

  if(stage === "quota" || stage === "error") return;

  if(status === "run"){ setStage(stage, "run"); return; }
  if(status === "ok" || status === "warn") setStage(stage, status);
  if(status === "fail"){
    setStage(stage, "fail");
    $("err").textContent = text || "失败";
    return;
  }

  if(stage === "extract" && data) showExtract(data);

  if(stage === "done" && data && (data.md || data.brief)){
    setStage("render", "ok");   // 兜底：服务端若漏发 render ok，这里补上，避免「成稿」永远转圈
    const full = data.md || data.brief || "";
    const brief = data.brief || full;
    $("bview").innerHTML = md2html(brief);
    $("rview").innerHTML = md2html(full);
    $("report").textContent = full;
    $("reportCard").style.display = "block";
    showTab("brief");            // 默认给简约版：先结论，详细版按需展开
    const blob = new Blob([full], {type: "text/markdown;charset=utf-8"});
    $("dl").href = URL.createObjectURL(blob);
    uploadId = "";
    $("file").value = "";
    $("fileLabel").classList.remove("done");
    $("url").value = "";   // 一次读解用完即清：留着下次上传视频时会把旧链接一起提交，报告头被污染
  }
}

function showTab(name){
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.v === name));
  $("bview").style.display   = name === "brief" ? "block" : "none";
  $("rview").style.display   = name === "view"  ? "block" : "none";
  $("report").style.display  = name === "raw"   ? "block" : "none";
}

document.querySelectorAll(".tab").forEach(t => {
  t.addEventListener("click", () => showTab(t.dataset.v));
});

$("go").addEventListener("click", run);
$("url").addEventListener("keydown", e => { if(e.key === "Enter") run(); });

fetch("/api/health").then(r => r.json()).then(h => {
  if(!h.llm){
    $("err").textContent = "服务端尚未配置 LLM_API_KEY，只能抓取不能读解。";
  }
  if(!h.asr){
    $("fname").textContent = "服务端未配置 ASR：上传后无法转写（仍可贴链接读元宝总结）。";
  }else if(!h.ffmpeg){
    $("fname").textContent = "服务端缺 ffmpeg：只能直传纯音频，视频需先转音频。";
  }
}).catch(() => {});
</script>
</body>
</html>

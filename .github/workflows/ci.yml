name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ffmpeg 给音频切片用例；缺了 test_asr 会自己跳过，不算失败
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install numpy        # 语音画像的分析依赖（服务本身无此依赖，有降级）

      # ── 安全命门：求值器的任何绕过都是阻断级问题 ──
      - name: safe_eval（35 项）
        run: python server/test_safe_eval.py

      # ── 限流器：内存 / Redis 两种实现，Redis 挂掉必须 fail closed ──
      - name: 限流器（三态 / fail closed / 熔断）
        run: python server/test_ratelimit.py

      # ── 错误码表：编号连续 / 异常持码一致 / 占位符与调用点双向一致 / 展示口径 ──
      # 这一段曾漏接 CI（v2.28 加了文件却没加步骤），等于守门没上岗
      - name: 错误码表（25 码 / 占位符 / 展示口径）
        run: python server/test_codes.py

      # ── 五道守门：文档↔码表 / 错误返回带码 / 每码有触发用例 / 文案不入断言 / 两态 ──
      - name: 五道守门（P3）
        run: python server/test_guards.py

      # ── 流水线错误路径：4001 / 4003 / 4004 / 4005 / 4006 各走一次 ──
      - name: 流水线错误路径
        run: python server/test_pipeline_codes.py

      # ── HTTP 层：真起服务、打真请求；analyze 用假 pipeline，不花钱 ──
      - name: HTTP 层（路由 / 校验 / 限流 / SSE 收尾）
        run: python server/test_app.py

      # ── 端到端：真起服务 + 假模型 + 假页面，验「网址 ↔ 上传音视频」切换后的报告头 ──
      - name: 输入切换端到端
        run: python tools/e2e_switch_check.py --rounds 2

      # ── 前后端契约：stage/status 认不认，错误展示字段用不用 ──
      - name: 前后端契约（阶段标签 / 错误展示 / 配色对比度）
        run: python server/test_ui_contract.py

      # ── 抓取层：patch 掉网络、真调 fetch()，覆盖 FETCH_BACKEND 三档与未设置 ──
      - name: 抓取层（公众号 / 通用网页 / 回退）
        run: python server/test_extract.py

      # ── 五阶段数据流：假模型替身，不联网不花钱 ──
      - name: pipeline 端到端
        run: python server/test_pipeline_e2e.py

      - name: 视频号路径（L1 二手标注）
        run: python server/test_video.py

      # ── 媒体层：假 ffmpeg 覆盖失败分支；真 ffmpeg 再跑一遍 ──
      - name: 媒体层（无 ffmpeg / 切片失败 / 时长探不到）
        run: python server/test_media.py

      # ── ASR 适配层：后端判定、错误映射、未配置与空转录（不需要 ffmpeg）──
      - name: ASR 适配层（四档判定 / 413·429·5xx / verbose_json 降级）
        run: python server/test_asr_backend.py

      - name: ASR 链路
        run: python server/test_asr.py

      # ── 自产报告审计回归：空表 / 假算 / 三态判定 ──
      - name: 审计回归
        run: python server/test_audit.py

      - name: 出处检索与权威判定
        run: python server/test_search.py

      # ── 健壮性 ──
      - name: JSON 截断抢救与重试
        run: python server/test_json.py

      - name: TLS 出口（CA 优先级 / 重试 / 错误翻译）
        run: python server/test_net.py

      # ── 体检脚本：它自己崩掉，用户就彻底没了线索 ──
      - name: 体检脚本（脱敏 / 三种 TLS 结局 / 无网也能跑完）
        run: python server/test_doctor.py

      - name: 语音画像
        run: python server/test_voice.py

      # ── 历史实况回放：v1.0–v1.6 出过的错，不能回来 ──
      - name: 回放回归（6 组历史误判）
        run: |
          python server/test_replay_v10.py --assert
          python server/test_replay_v10.py   # 演示模式也要能跑（chk 曾在 test_all 内定义，演示模式必崩）
